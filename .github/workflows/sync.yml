name: Sync AI Compare Data

on:
  schedule:
    # run at midnight turkey time
    - cron: '0 21 * * *'
  # manual trigger support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.gh_pat || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # run python sync script
      - name: Fetch and update data
        run: |
          python sync.py

      # commit and push all changes in one commit
      - name: Commit and push changes
        run: |
          git config user.name "ai-compare-sync"
          git config user.email "no_email@example.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "sync ai compare data"
            git push
          fi
